name: Deploy static handbook to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify and package static handbook
        run: |
          python3 scripts/build_comparison.py --check
          python3 -m unittest discover -s tests -v
          node tests/test_comparison.cjs
          node tests/test_navigation.cjs
          mkdir -p _site
          cp index.html .nojekyll CITATION.cff _site/
          cp -R assets _site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

